<link rel="stylesheet" href="{{site.url}}/assets/css/quran-digital.css">
<section class="quran-digital" aria-labelledby="quran-title">
  <div class="container">
    <div class="quran-intro"><p><span></span> Quran digital</p><h1 id="quran-title">Baca dengan tenang.<br><em>Pahami lebih dalam.</em></h1><div class="quran-local-status"><i class="fas fa-check-circle"></i> Data Quran tersedia secara lokal</div></div>
    <div class="quran-reader-shell">
      <div class="quran-controls"><div class="quran-search"><i class="fas fa-search"></i><input id="quran-search" type="search" placeholder="Cari nama surah, misalnya Al-Baqarah" autocomplete="off"></div><select id="select-surah" aria-label="Pilih surah"></select><button id="enter-quran" type="button">Buka surah <i class="fas fa-arrow-right"></i></button></div>
      <div id="quran-state" class="quran-state">Menyiapkan mushaf digital…</div>
      <div id="quran-list" aria-live="polite"></div>
    </div>
  </div>
</section>

<div class="container quran-support"><div class="row justify-content-start"><div class="col-md-4 col-xs-12 col-sm-12"><div class="polaroid"><img src="{{site.url}}{{myroom.vector.delapan}}" alt="Ilustrasi jadwal shalat" class="img-responsive mt-3"><div class="polaroid-body" id="jadwal-shalat"><h5 class="mt-2 mb-2 text-center text-dark" id="kota"></h5><h6 class="mb-2 text-center text-danger blockquote-footer" id="now2"></h6><h6 class="mb-2 text-center text-danger" id="now1"></h6><p id="tanggal" class="mb-3 underline text-success text-center"></p><small id="result-time" class="mt-2 text-danger text-center"></small><ul class="list-group list-group-flush" id="waktu-adzan" style="list-style:none;"></ul></div></div></div><div class="col-md-6 col-xs-12 col-sm-12 mt-2 ml-2"><h2>{{myroom.dalil.judul}}</h2><p class="text-center" style="font-weight:500;">{{myroom.dalil.satu}}</p><p style="text-indent:45px;text-align:justify;">{{myroom.dalil.dua}}</p><img src="{{site.url}}{{myroom.vector.sepuluh}}" style="border-radius:50%;" alt="" class="img-responsive mt-3"></div></div></div>
